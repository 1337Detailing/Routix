name: Build Routix APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'RoutixStandalone/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'RoutixStandalone/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore original stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: routix-debug-signing-v1

      - name: Ensure stable Android debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Valid from:'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test Routix
        working-directory: RoutixStandalone
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload UI layout checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-layout-checks
          path: RoutixStandalone/app/build/reports/chrome/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Name APK
        run: mv RoutixStandalone/app/build/outputs/apk/debug/app-debug.apk RoutixStandalone/app/build/outputs/apk/debug/Routix-debug.apk

      - name: Upload Routix APK
        uses: actions/upload-artifact@v7
        with:
          name: Routix-debug
          path: RoutixStandalone/app/build/outputs/apk/debug/Routix-debug.apk
          if-no-files-found: error
          retention-days: 14
