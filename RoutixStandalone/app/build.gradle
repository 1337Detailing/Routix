plugins {
    id 'com.android.application'
}

android {
    namespace 'com.routix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.routix.app'
        minSdk 26
        targetSdk 36
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        def publishCode = System.getenv('ROUTIX_VERSION_CODE')
        versionCode publishCode ? publishCode.toInteger() : (runNumber ? 300000 + runNumber.toInteger() : 300001)
        versionName System.getenv('ROUTIX_VERSION_NAME') ?: '2.2.0'
    }

    testOptions { unitTests.includeAndroidResources = true }

    // Signing uses environment variables; credentials are never stored in the repository.
    def uploadKeystore = System.getenv('ROUTIX_UPLOAD_STORE_FILE')
    def uploadPassword = System.getenv('ROUTIX_UPLOAD_STORE_PASSWORD')
    def uploadAlias = System.getenv('ROUTIX_UPLOAD_KEY_ALIAS')
    def uploadKeyPassword = System.getenv('ROUTIX_UPLOAD_KEY_PASSWORD')
    def hasUploadSigning = [uploadKeystore, uploadPassword, uploadAlias, uploadKeyPassword].every { it != null && !it.trim().isEmpty() }

    if (hasUploadSigning) {
        signingConfigs {
            play {
                storeFile file(uploadKeystore)
                storePassword uploadPassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    if (System.getenv('GITHUB_ACTIONS') == 'true') {
        signingConfigs {
            debug {
                storeFile file("${System.getenv('HOME')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // Keep shrinker disabled until MapLibre and osmdroid rules are verified on devices.
            minifyEnabled false
            if (hasUploadSigning) signingConfig signingConfigs.play
        }
        debug {
            // Keep this stable forever: future CI APKs replace previous Routix debug installs.
            if (System.getenv('GITHUB_ACTIONS') == 'true') signingConfig signingConfigs.debug
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.mapsforge:mapsforge-core:0.21.0'
        force 'org.mapsforge:mapsforge-map:0.21.0'
        force 'org.mapsforge:mapsforge-map-android:0.21.0'
        force 'org.mapsforge:mapsforge-themes:0.21.0'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.20'
    implementation 'org.maplibre.gl:android-sdk:13.1.0'
}
